[project]
name = "polaris-nmfp-adapter"
version = "1.0.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "essentia==2.1b6.dev1110",
  "librosa>=0.10.2,<0.12",
  "numpy==1.24.3",
  "pydub>=0.25.1,<0.26",
  "pyyaml>=6,<7",
  "soundfile>=0.13,<0.14",
  "tensorflow-macos==2.13.1; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "tensorflow==2.13.1; sys_platform != 'darwin' or platform_machine != 'arm64'",
]

[tool.uv]
package = false
