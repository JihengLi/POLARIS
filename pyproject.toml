[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "polaris-audio-fingerprinting"
version = "1.0.0"
description = "Reproducible implementation and evaluation of POLARIS audio fingerprinting"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Jiheng Li", email = "jiheng.li.1@vanderbilt.edu" }]
dependencies = [
  "librosa>=0.10.2,<0.12",
  "numpy>=1.26,<3",
  "pydub>=0.25.1,<0.26",
  "scipy>=1.11,<2",
]

[project.scripts]
polaris = "polaris.engine:main"
polaris-data = "polaris_eval.download:main"
polaris-evaluate = "polaris_eval.run:main"
polaris-report = "polaris_eval.report:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/polaris", "src/polaris_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
